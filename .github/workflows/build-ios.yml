name: Build iOS

# 没有 Mac 也能出 .ipa：GitHub 提供 macOS 运行器，自带 Xcode。
# 公开仓库免费无限量。
#
# ⚠️ 路径约定：本仓库根目录 = 工程目录，project.yml 就在根下。
#    所以所有命令都在仓库根执行，不要再 cd 到子目录。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EarTimer
    runs-on: macos-15
    timeout-minutes: 30

    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: 安装 XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: 生成工程
        run: |
          echo "工作目录: $(pwd)"
          ls -la project.yml
          xcodegen generate
          echo "--- 生成结果 ---"
          ls -d *.xcodeproj
          echo "--- target 列表 ---"
          xcodebuild -project EarTimer.xcodeproj -list

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project EarTimer.xcodeproj \
            -scheme EarTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            > build.log 2>&1 || {
              echo "::error::编译失败"
              echo "================ 错误 ================"
              grep -E "error:" build.log | head -60 || true
              echo "================ 末尾 80 行 ================"
              tail -80 build.log
              exit 1
            }
          echo "编译成功"
          tail -5 build.log

      - name: 定位产物
        id: locate
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name "EarTimer.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 EarTimer.app"
            find build/DerivedData/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "找到：$APP"

      - name: 打包未签名 .ipa
        run: |
          APP="${{ steps.locate.outputs.app }}"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry EarTimer-unsigned.ipa Payload
          ls -lh EarTimer-unsigned.ipa
          unzip -l EarTimer-unsigned.ipa | head -10

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EarTimer-ipa
          path: build/EarTimer-unsigned.ipa
          retention-days: 14

      - name: 上传 .app
        uses: actions/upload-artifact@v4
        with:
          name: EarTimer-app
          path: ${{ steps.locate.outputs.app }}
          retention-days: 14

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
