name: Build iOS

# 没有 Mac 也能出 .ipa：GitHub 提供 macOS 运行器，自带 Xcode。
# 免费额度：公开仓库无限，私有仓库每月 2000 分钟（macOS 按 10 倍计费 = 200 分钟）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned     # 不签名，产出未签名 .ipa（可自签后装）
          - simulator    # 只验证能编译，产出 .app

jobs:
  build:
    name: Build EarTimer
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: |
          cd EarTimer
          xcodegen generate
          ls -la

      # 关键一步：不依赖任何签名，先把「能不能编译」验证掉。
      # 这一步失败 = 代码有问题；通过 = 代码可编译，只是还没签名。
      - name: 编译（不签名）
        run: |
          cd EarTimer
          set -o pipefail
          xcodebuild \
            -project EarTimer.xcodeproj \
            -scheme EarTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build.log | xcpretty || {
              echo "===== 编译失败，完整日志见下 ====="
              tail -200 build.log
              exit 1
            }

      - name: 打包成未签名 .ipa
        if: github.event.inputs.build_type != 'simulator'
        run: |
          cd EarTimer
          APP="build/DerivedData/Build/Products/Release-iphoneos/EarTimer.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 .app，列出产物："
            find build/DerivedData/Build/Products -maxdepth 2 -name "*.app"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr EarTimer-unsigned.ipa Payload
          ls -lh EarTimer-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: EarTimer-build
          path: |
            EarTimer/build/EarTimer-unsigned.ipa
            EarTimer/build/DerivedData/Build/Products/Release-iphoneos/*.app
            EarTimer/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: 编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: EarTimer/build.log
          retention-days: 7
